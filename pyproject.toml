[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtbdi-assistant"
version = "0.1.0"
description = "AI reporting assistant scaffolding for RT BDI website automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.1",
  "openai>=2.43.0",
  "openpyxl>=3.1.5",
  "pandas>=3.0.3",
  "playwright>=1.57.0",
  "python-dateutil>=2.9.0.post0",
  "xlrd>=2.0.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0"
]

[project.scripts]
rtbdi = "rtbdi_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
